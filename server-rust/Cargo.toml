[package]
name = "chat-server"
version = "1.0.0"
edition = "2024"
description = "Relay between the chat clients (TCP/JSON) and the Java backend: sessions, authentication and push notifications"
license = "MIT"

[lib]
name = "chat_server"
path = "src/lib.rs"

[[bin]]
name = "chat-server"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
ctrlc = "3"
libc = "0.2"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
