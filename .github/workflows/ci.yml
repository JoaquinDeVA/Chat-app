name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - run: make test-backend

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - run: cd server-rust && cargo fmt --check && cargo clippy --all-targets -- -D warnings
      - run: make test-server

  python-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest pytest-cov ruff
      - run: cd client-python && ruff check . && ruff format --check .
      - run: make test-client-python

  c-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libncurses-dev
      - run: make build-client-c test-client-c
      - name: Tests under AddressSanitizer and UBSan
        run: |
          make -C client-c clean
          make -C client-c test CFLAGS="-std=c11 -Wall -Wextra -g -fsanitize=address,undefined"

  end-to-end:
    runs-on: ubuntu-latest
    needs: [backend, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - run: make e2e
