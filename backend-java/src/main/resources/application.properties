# ============================================================================
# Chat Application — Base Configuration
# ============================================================================
# This file is committed to git and contains safe defaults only.
#
# To run locally, copy this snippet into a new file:
#   backend-java/src/main/resources/application-dev.properties
# and fill in your real credentials. That file is .gitignored.
#
# Example application-dev.properties:
#   spring.datasource.url=jdbc:mysql://localhost:3306/chat_db
#   spring.datasource.username=root
#   spring.datasource.password=your_password_here
#   spring.jpa.hibernate.ddl-auto=none
# ============================================================================

# ============================================================================
# DATABASE CONFIGURATION
# ============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/chat_db
spring.datasource.username=root
# Override this in application-dev.properties — do not put a real password here
spring.datasource.password=CHANGE_ME

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ============================================================================
# JPA / HIBERNATE CONFIGURATION
# ============================================================================
# DDL strategy:
# - create-drop: Drop schema on startup and recreate (development only)
# - update: Update existing schema (safe for development)
# - validate: Validate schema matches entities (production)
# - none: No schema management (production)
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries (disable in production for performance)
spring.jpa.show-sql=false

# Format SQL output (useful for debugging)
spring.jpa.properties.hibernate.format_sql=false

# Hibernate dialect for MySQL 8.x
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============================================================================
# APPLICATION CONFIGURATION
# ============================================================================
# Application name
spring.application.name=chat-backend

# Lazy init: beans se crean solo cuando se necesitan por primera vez
spring.main.lazy-initialization=true

# Server port (only used if REST endpoints are added back)
server.port=8080

# ============================================================================
# LOGGING
# ============================================================================
# Log levels
logging.level.root=INFO
logging.level.com.ped3.chat=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
