# ============================================================================
# Chat backend - base configuration
# ============================================================================
# Every setting can be overridden with an environment variable (see ../.env.example); the
# defaults match docker-compose.yml, whose MySQL listens on host port 3323 (not the default
# 3306) so it never clashes with a MySQL you already run.
# Private credentials: put them in application-dev.properties (git-ignored) and start the
# backend with --spring.profiles.active=dev.

# Database
spring.datasource.url=${CHAT_DB_URL:jdbc:mysql://localhost:3323/chat_app}
spring.datasource.username=${CHAT_DB_USER:chat}
spring.datasource.password=${CHAT_DB_PASSWORD:chat_dev}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# The schema is created by shared/database.sql; Hibernate only checks that it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Application
spring.application.name=chat-backend
spring.main.web-application-type=none
# Port the Rust server connects to
chat.tcp.port=${CHAT_BACKEND_PORT:9090}

# Logging
logging.level.root=INFO
logging.level.com.chatapp=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
